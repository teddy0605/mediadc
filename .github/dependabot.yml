# Dependabot opens pull requests when dependencies have new versions.
# - cooldown: wait 7 days after a release before proposing it, so a compromised or broken
#   release is usually caught (and pulled) by others first. Security fixes ignore cooldown.
# - groups: one PR per ecosystem instead of one PR per package, and one grouped PR for
#   security updates (applies-to: security-updates) instead of one PR per advisory.
# npm and pip PRs (and GitHub-owned action bumps) merge automatically once CI, the
# supply-chain checks and the Nextcloud integration test pass
# (.github/workflows/dependabot-auto-merge.yml). Red PRs and third-party actions stay open.
version: 2
updates:
  # Keeps the SHA pins in .github/workflows/*.yml current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # Frontend build dependencies (package.json / package-lock.json).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    # @nextcloud/eslint-config 9 needs ESLint 10 and a flat config, and its stricter rules
    # flag hundreds of lines in src/. Migrate deliberately, not through a Dependabot PR.
    ignore:
      - dependency-name: "@nextcloud/eslint-config"
        update-types: ["version-update:semver-major"]
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: [minor, patch]

  # Python: the worker's requirements.txt and the CI tools in .github/ci-requirements.txt.
  # Worker pins are verified on the Nextcloud Docker image; test before merging.
  - package-ecosystem: pip
    directories: [/, /.github]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      pip-security:
        applies-to: security-updates
        patterns: ["*"]
      pip:
        applies-to: version-updates
        patterns: ["*"]
